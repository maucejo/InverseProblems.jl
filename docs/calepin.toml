# SourceEstimation.jl documentation, built with Calepin (Typst + executed Julia chunks).
#
#   uv sync  # Python bridge to the Jupyter (IJulia) kernel
#   julia --project=. -e 'using Pkg; Pkg.instantiate()'
#   calepin compile .                         # build into _site/
#   calepin watch . _site --serve --open      # live preview
#
# See README.md for details.

title = "SourceEstimation.jl"
description = "Regularized resolution of linear inverse problems in Julia: force reconstruction and source identification in structural dynamics and acoustics."
base-url = "https://maucejo.github.io/SourceEstimation.jl"

theme = "./theme"
logo = "assets/logo-nav.svg"
logo-alt = "SourceEstimation.jl"
favicon = "assets/favicon.svg"
image = "assets/logo.svg"
theme-color = "#4063D8"

output-dir = "_site"
asset-dir = "_calepin"   # GitHub Pages does not serve dot-directories
pdf = false
typ = false
minify = true
search = "pagefind"

[executables]
python = ".venv/bin/python"

[static]
include = ["assets/**"]

# Helpers (Typst UI components, Julia scripts) are imported by pages, not published.
[pages]
exclude = ["_lib/**", "_site/**", ".venv/**", "README.md"]

[toc]
enabled = true
depth = 2
floating = true

